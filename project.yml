name: DaysRemember
options:
  bundleIdPrefix: com.shiguang
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: ""
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  DaysRemember:
    type: application
    platform: iOS
    sources:
      - path: DaysRemember
    dependencies:
      - target: DaysRememberWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shiguang.daysremember
        PRODUCT_NAME: 时光
        PRODUCT_MODULE_NAME: DaysRemember
        INFOPLIST_FILE: DaysRemember/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: DaysRemember/Resources/DaysRemember.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  DaysRememberWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: DaysRememberWidget
        excludes:
          - "*.entitlements"
          - "Info.plist"
      # Shared with the main app — pure-data sources only (no UI).
      - path: DaysRemember/Models
      - path: DaysRemember/Lunar
      - path: DaysRemember/Theme
      - path: DaysRemember/Store/SharedStorage.swift
      # Shared photo rendering keeps widget crops identical to the app.
      - path: DaysRemember/Views/Components/PhotoTile.swift
      # Shared system cover artwork used by PhotoStyle in both app and widget.
      - path: DaysRemember/Resources/Assets.xcassets
        buildPhase: resources
      # Shared typography for the app and widget.
      - path: DaysRemember/Resources/Fonts
        buildPhase: resources
      - path: DaysRemember/Resources/Localization
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shiguang.daysremember.widget
        PRODUCT_NAME: DaysRememberWidget
        INFOPLIST_FILE: DaysRememberWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: DaysRememberWidget/DaysRememberWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        SKIP_INSTALL: YES
  DaysRememberTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DaysRememberTests
    dependencies:
      - target: DaysRemember
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shiguang.daysremember.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/时光.app/时光"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
  DaysRememberUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DaysRememberUITests
    dependencies:
      - target: DaysRemember
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shiguang.daysremember.uitests
        TEST_TARGET_NAME: DaysRemember
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DaysRemember:
    build:
      targets:
        DaysRemember: all
    run:
      config: Debug
    test:
      config: Debug
      language: zh-Hans
      region: CN
      targets:
        - DaysRememberTests
        - DaysRememberUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  DaysRememberWidget:
    build:
      targets:
        DaysRememberWidget: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
