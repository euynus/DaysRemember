name: DaysRemember
options:
  bundleIdPrefix: dev.gooday
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    # The 10-character Team ID from developer.apple.com › Membership; archiving needs it
    # (scripts/archive.sh also takes TEAM_ID=…).
    DEVELOPMENT_TEAM: V9KCA3SG7G
    # App and widget share these through their Info.plists. scripts/archive.sh sets the build
    # number for each upload; raise MARKETING_VERSION for each App Store version.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # The widget has no target-level identity, so an empty one here would leave it unsigned on
    # device; exporting re-signs both with Apple Distribution.
    CODE_SIGN_IDENTITY: Apple Development
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  DaysRemember:
    type: application
    platform: iOS
    sources:
      - path: DaysRemember
    dependencies:
      - target: DaysRememberWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gooday.days
        PRODUCT_NAME: 时光
        PRODUCT_MODULE_NAME: DaysRemember
        INFOPLIST_FILE: DaysRemember/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: DaysRemember/Resources/DaysRemember.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  DaysRememberWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: DaysRememberWidget
        excludes:
          - "*.entitlements"
          - "Info.plist"
      # Shared with the main app — pure-data sources only (no UI).
      - path: DaysRemember/Models
      - path: DaysRemember/Lunar
      - path: DaysRemember/Theme
      - path: DaysRemember/Store/SharedStorage.swift
      # The intent behind the Control Center button opens the app through a pending link.
      - path: DaysRemember/Intents/NewDayIntent.swift
      - path: DaysRemember/Intents/PendingLink.swift
      # Shared photo rendering keeps widget crops identical to the app.
      - path: DaysRemember/Views/Components/PhotoTile.swift
      - path: DaysRemember/Views/Components/PhotoDecodeCache.swift
      - path: DaysRemember/Views/Components/PhotoDigestMemo.swift
      # The widget's own Assets.xcassets holds the flat cover vectors, written by
      # scripts/flat-covers.py.
      # Shared typography for the app and widget.
      - path: DaysRemember/Resources/Fonts
        buildPhase: resources
      - path: DaysRemember/Resources/Localization
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gooday.days.widget
        PRODUCT_NAME: DaysRememberWidget
        INFOPLIST_FILE: DaysRememberWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: DaysRememberWidget/DaysRememberWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        SKIP_INSTALL: YES
  DaysRememberTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DaysRememberTests
    dependencies:
      - target: DaysRemember
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gooday.days.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/时光.app/时光"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
  DaysRememberUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DaysRememberUITests
    dependencies:
      - target: DaysRemember
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gooday.days.uitests
        TEST_TARGET_NAME: DaysRemember
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DaysRemember:
    build:
      targets:
        DaysRemember: all
    run:
      config: Debug
    test:
      config: Debug
      language: zh-Hans
      region: CN
      targets:
        - DaysRememberTests
        - DaysRememberUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  DaysRememberCI:
    build:
      targets:
        DaysRemember: all
    test:
      config: Debug
      language: zh-Hans
      region: CN
      gatherCoverageData: true
      coverageTargets:
        - DaysRemember
      targets:
        - name: DaysRememberTests
          parallelizable: false
        - name: DaysRememberUITests
          parallelizable: false
          skippedTests:
            # Requires a manually configured SpringBoard Home Screen.
            - WidgetHomeUITests
  DaysRememberWidget:
    build:
      targets:
        DaysRememberWidget: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
