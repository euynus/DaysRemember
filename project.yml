name: DaysRemember
options:
  bundleIdPrefix: com.shiguang
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  DaysRemember:
    type: application
    platform: iOS
    sources:
      - path: DaysRemember
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shiguang.daysremember
        PRODUCT_NAME: 时光
        INFOPLIST_FILE: DaysRemember/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  DaysRememberTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DaysRememberTests
    dependencies:
      - target: DaysRemember
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shiguang.daysremember.tests
