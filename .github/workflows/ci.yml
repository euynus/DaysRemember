name: iOS CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and Release Build
    # The self-hosted Mac runs pushes, manual runs and this repository's own pull requests. A pull
    # request from a fork runs on GitHub's Mac instead: the repository is public, and a fork's code
    # must not run on a personal machine.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "macOS", "ARM64"]') || 'macos-26' }}
    timeout-minutes: 75
    env:
      IOS_DEVICE_TYPE: com.apple.CoreSimulator.SimDeviceType.iPhone-17
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # GitHub's Mac keeps several Xcodes and runtimes, so it is pinned to Xcode 26.6 and iOS 26.5.
      # The self-hosted Mac uses the Xcode it has selected, or else the newest in /Applications, and
      # its newest iOS runtime. (Asking xcodebuild with none selected opens an install prompt there.)
      - name: Choose Xcode
        run: |
          if [[ "$RUNNER_ENVIRONMENT" == github-hosted ]]; then
            echo "DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer" >> "$GITHUB_ENV"
            echo "IOS_RUNTIME=com.apple.CoreSimulator.SimRuntime.iOS-26-5" >> "$GITHUB_ENV"
          else
            selected="$(xcode-select -p 2>/dev/null || true)"
            if [[ "$selected" != *.app/Contents/Developer ]]; then
              ls -d /Applications/Xcode*.app 2>/dev/null || true
              xcode="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
              if [[ -z "$xcode" ]]; then
                echo "::error::No Xcode on this runner: install Xcode in /Applications, or select one with xcode-select."
                exit 1
              fi
              echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
            fi
          fi
          # A runner started as a service may not have Homebrew on its PATH.
          if [[ -d /opt/homebrew/bin ]]; then echo /opt/homebrew/bin >> "$GITHUB_PATH"; fi

      - name: Show the toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes available | grep iOS
          sysctl -n machdep.cpu.brand_string

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install XcodeGen and jq
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          command -v jq >/dev/null || brew install jq

      - name: Check the site and CI script
        run: |
          node --test scripts/site-tests/*.test.mjs
          bash scripts/ci-tests/ci.test.sh

      - name: Test and build
        run: bash scripts/ci.sh

      # Builds for a device as an App Store archive would, without signing, and checks the result.
      - name: Archive for a device (unsigned)
        run: bash scripts/archive.sh --unsigned

      - name: Upload test results and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ci/*/*.log
            build/ci/*/coverage.json
            build/ci/*/Tests.xcresult
            build/archive/*.log
          retention-days: 14
          if-no-files-found: warn
