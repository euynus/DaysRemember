<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>时光 · 图标精修</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #242424; background: #f7f7f8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
    main { max-width: 1160px; margin: auto; padding: 40px 32px; }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; padding-bottom: 24px; margin-bottom: 32px; border-bottom: 1px solid #dedee0; }
    h1 { margin: 0; font-size: 24px; font-weight: 600; }
    header p, footer { margin: 0; color: #656565; font-size: 12px; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 28px; }
    figure { min-width: 0; margin: 0; }
    .large-link { display: block; border-radius: 22%; }
    .large-link:focus-visible { outline: 3px solid #1476b8; outline-offset: 6px; }
    .large { display: block; width: 100%; height: auto; aspect-ratio: 1; border-radius: 22%; }
    figcaption { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 8px; margin-top: 18px; }
    .label { color: #6b6b6b; font-size: 12px; font-weight: 600; }
    h2 { margin: 0; font-size: 17px; font-weight: 550; }
    .status { min-height: 20px; margin: 8px 0 0; font-size: 12px; color: #6b6b6b; }
    .recommended { color: #187446; font-weight: 600; }
    .sizes { display: flex; align-items: end; gap: 20px; margin-top: 20px; padding-top: 20px; border-top: 1px solid #dedee0; }
    .size { display: grid; justify-items: center; gap: 10px; color: #6b6b6b; font-size: 11px; }
    .size img { display: block; border-radius: 22%; }
    footer { margin-top: 32px; padding-top: 20px; border-top: 1px solid #dedee0; }
    @media (max-width: 700px) {
      main { padding: 28px 20px; }
      header { display: block; margin-bottom: 24px; }
      header p { margin-top: 10px; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px 20px; }
      h2 { font-size: 16px; }
      .sizes { gap: 16px; }
    }
    @media (max-width: 360px) {
      main { padding-inline: 16px; }
      .grid { column-gap: 16px; }
      figcaption { column-gap: 6px; }
      .sizes { gap: 12px; }
    }
  </style>
</head>
<body>
  <main>
    <header><h1>时光 · 图标精修</h1><p>2026.10.04 / C 系列</p></header>
    <section class="grid" aria-label="原版与三款精修候选">
      <figure>
        <a class="large-link" href="current.png" aria-label="查看当前图标原图"><img class="large" src="current.png" width="1024" height="1024" alt="原版：黑底金色太阳与尖端纤细的白色月牙"></a>
        <figcaption><span class="label">C0</span><h2>当前版本</h2></figcaption>
        <p class="status">App 正在使用</p>
        <div class="sizes"><div class="size"><img src="current.png" width="60" height="60" alt="原版图标，60像素"><span>60 px</span></div><div class="size"><img src="current.png" width="40" height="40" alt="原版图标，40像素"><span>40 px</span></div></div>
      </figure>
      <figure>
        <a class="large-link" href="c1-geometric.png" aria-label="查看 C1 几何精修原图"><img class="large" src="c1-geometric.png" width="1254" height="1254" alt="C1：更紧凑的太阳、饱满月牙和圆润端点"></a>
        <figcaption><span class="label">C1</span><h2>几何精修</h2></figcaption>
        <p class="status recommended">推荐</p>
        <div class="sizes"><div class="size"><img src="c1-geometric.png" width="60" height="60" alt="C1图标，60像素"><span>60 px</span></div><div class="size"><img src="c1-geometric.png" width="40" height="40" alt="C1图标，40像素"><span>40 px</span></div></div>
      </figure>
      <figure>
        <a class="large-link" href="c2-soft-relief.png" aria-label="查看 C2 温润叠层原图"><img class="large" src="c2-soft-relief.png" width="1254" height="1254" alt="C2：具有轻微纸面肌理和浅浮雕层次的日月"></a>
        <figcaption><span class="label">C2</span><h2>温润叠层</h2></figcaption>
        <p class="status">轻质感</p>
        <div class="sizes"><div class="size"><img src="c2-soft-relief.png" width="60" height="60" alt="C2图标，60像素"><span>60 px</span></div><div class="size"><img src="c2-soft-relief.png" width="40" height="40" alt="C2图标，40像素"><span>40 px</span></div></div>
      </figure>
      <figure>
        <a class="large-link" href="c3-editorial.png" aria-label="查看 C3 柔和轮廓原图"><img class="large" src="c3-editorial.png" width="1254" height="1254" alt="C3：带有轻微不对称轮廓和宽阔间隔的日月"></a>
        <figcaption><span class="label">C3</span><h2>柔和轮廓</h2></figcaption>
        <p class="status">自然曲线</p>
        <div class="sizes"><div class="size"><img src="c3-editorial.png" width="60" height="60" alt="C3图标，60像素"><span>60 px</span></div><div class="size"><img src="c3-editorial.png" width="40" height="40" alt="C3图标，40像素"><span>40 px</span></div></div>
      </figure>
    </section>
    <footer>时光 · Days Remember</footer>
  </main>
</body>
</html>
