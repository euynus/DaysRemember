<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时光 · Days Remember</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+SC:wght@400;500;700;900&family=Caveat:wght@400;500;600;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  html, body { margin: 0; padding: 0; background: #EDECEF; font-family: "Inter", "PingFang SC", "Noto Sans SC", -apple-system, system-ui, sans-serif; }
  body { overflow: hidden; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="lunar.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="screens/Stickers.jsx"></script>
<script type="text/babel" src="screens/Onboarding.jsx"></script>
<script type="text/babel" src="screens/Home.jsx"></script>
<script type="text/babel" src="screens/Detail.jsx"></script>
<script type="text/babel" src="screens/Add.jsx"></script>
<script type="text/babel" src="screens/Categories.jsx"></script>
<script type="text/babel" src="screens/Calendar.jsx"></script>
<script type="text/babel" src="screens/Widgets.jsx"></script>
<script type="text/babel" src="screens/Share.jsx"></script>
<script type="text/babel" src="screens/Notifications.jsx"></script>

<script type="text/babel">

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "dark": false,
  "homeVariant": "mosaic"
}/*EDITMODE-END*/;

/* ─────────────── Prototype shell: interactive flow ─────────────── */
function Prototype({ onlyScreen = null }) {
  const [screen, setScreen] = React.useState(onlyScreen || 'home');
  const [selectedDay, setSelectedDay] = React.useState(null);

  const openDay = (d) => { setSelectedDay(d); setScreen('detail'); };
  const back = () => setScreen('home');

  const content = () => {
    if (screen === 'home') return <HomeScreen onOpenDay={openDay} onAdd={() => setScreen('add')}/>;
    if (screen === 'detail') return <DetailScreen day={selectedDay || DAYS[0]} onBack={back}/>;
    if (screen === 'add') return <AddScreen onBack={back}/>;
    if (screen === 'categories') return <CategoriesScreen onBack={back}/>;
    if (screen === 'calendar') return <CalendarScreen onBack={back}/>;
    if (screen === 'widgets') return <WidgetsScreen onBack={back}/>;
    if (screen === 'notifications') return <NotificationsScreen onBack={back}/>;
    if (screen === 'onboarding') return <OnboardingPaged page={0}/>;
    if (screen === 'share') return <ShareCardScreen onBack={back}/>;
    return null;
  };

  return (
    <div className="sg" style={{ width: '100%', height: '100%' }}>
      {content()}

      {/* bottom tab bar — hidden on certain screens */}
      {!['onboarding','detail','add','share','widgets'].includes(screen) && (
        <TabBar current={screen} onNav={setScreen}/>
      )}
    </div>
  );
}

function TabBar({ current, onNav }) {
  const tabs = [
    { id: 'home', label: '日子', icon: 'grid' },
    { id: 'calendar', label: '日历', icon: 'cal' },
    { id: 'categories', label: '分类', icon: 'tag' },
    { id: 'notifications', label: '提醒', icon: 'bell' },
  ];
  return (
    <div className="toolbar" style={{
      position: 'absolute', left: 16, right: 16, bottom: 30, zIndex: 30,
      justifyContent: 'space-between', padding: 8,
    }}>
      {tabs.map(t => {
        const on = current === t.id;
        return (
          <button key={t.id} onClick={() => onNav(t.id)} style={{
            flex: 1, border: 'none',
            background: on ? 'var(--ink)' : 'transparent',
            color: on ? '#fff' : 'var(--muted)',
            padding: '8px 0', borderRadius: 999, height: 44,
            display: 'flex', flexDirection: 'row', alignItems: 'center', justifyContent: 'center', gap: 6,
            cursor: 'pointer', fontFamily: 'var(--sans)',
            transition: 'background 0.2s, color 0.2s',
          }}>
            <TabIcon name={t.icon} stroke="currentColor" filled={on}/>
            {on && <span style={{ fontSize: 13, fontWeight: 700, letterSpacing: '-0.01em' }}>{t.label}</span>}
          </button>
        );
      })}
    </div>
  );
}
function TabIcon({ name, stroke, filled }) {
  const p = { fill: filled ? stroke : 'none', stroke, strokeWidth: filled ? 1.2 : 1.8, strokeLinecap: 'round', strokeLinejoin: 'round' };
  if (name === 'grid') return <svg width="20" height="20" viewBox="0 0 20 20" {...p}><rect x="2.5" y="2.5" width="6.5" height="6.5" rx="1.8"/><rect x="11" y="2.5" width="6.5" height="6.5" rx="1.8"/><rect x="2.5" y="11" width="6.5" height="6.5" rx="1.8"/><rect x="11" y="11" width="6.5" height="6.5" rx="1.8"/></svg>;
  if (name === 'cal') return <svg width="20" height="20" viewBox="0 0 20 20" {...p}><rect x="2.5" y="4" width="15" height="13.5" rx="2.5"/><path d="M2.5 8h15M6.5 2.2v3.2M13.5 2.2v3.2" stroke={stroke} fill="none"/></svg>;
  if (name === 'tag') return <svg width="20" height="20" viewBox="0 0 20 20" {...p}><path d="M9.5 2.5H3.5a1 1 0 00-1 1v6L11 18l7-7L9.5 2.5z"/><circle cx="6.5" cy="6.5" r="1.1" fill={filled ? '#fff' : stroke}/></svg>;
  if (name === 'bell') return <svg width="20" height="20" viewBox="0 0 20 20" {...p}><path d="M4.5 8a5.5 5.5 0 0111 0v4l1.5 2.2H3L4.5 12V8z"/><path d="M8 17a2 2 0 004 0" stroke={stroke} fill="none"/></svg>;
  return null;
}

/* ─────────────── Main app: design canvas with all screens ─────────────── */
function App() {
  const [tweaks, setTweaks] = React.useState({ ...TWEAK_DEFAULTS });
  const [tweaksVisible, setTweaksVisible] = React.useState(false);

  React.useEffect(() => {
    const onMsg = (e) => {
      if (!e.data) return;
      if (e.data.type === '__activate_edit_mode') setTweaksVisible(true);
      if (e.data.type === '__deactivate_edit_mode') setTweaksVisible(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const setTweak = (k, v) => {
    setTweaks(t => {
      const next = { ...t, [k]: v };
      window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*');
      return next;
    });
  };

  const frame = (child, key) => (
    <div style={{ width: '100%', height: '100%' }} key={key}>
      <IOSDevice width={402} height={874}>{child}</IOSDevice>
    </div>
  );

  return (
    <>
      <DesignCanvas minScale={0.2} maxScale={2}>
        <DCSection id="hero" title="时光 · Days Remember" subtitle="旅行手账风 · 拍立得卡片 · 便利贴 · 贴纸">
          <DCArtboard id="home" label="A · 首页 · 手账墙" width={402} height={874}>
            {frame(<Prototype/>, 'home-main')}
          </DCArtboard>
          <DCArtboard id="detail" label="B · 日子详情" width={402} height={874}>
            {frame(<Prototype onlyScreen="detail"/>, 'detail')}
          </DCArtboard>
          <DCArtboard id="add" label="C · 添加新日子" width={402} height={874}>
            {frame(<Prototype onlyScreen="add"/>, 'add')}
          </DCArtboard>
          <DCArtboard id="share" label="D · 分享卡片" width={402} height={874}>
            {frame(<Prototype onlyScreen="share"/>, 'share')}
          </DCArtboard>
        </DCSection>

        <DCSection id="browse" title="浏览与组织" subtitle="分类、日历、小组件、提醒设置">
          <DCArtboard id="categories" label="E · 分类" width={402} height={874}>
            {frame(<Prototype onlyScreen="categories"/>, 'cat')}
          </DCArtboard>
          <DCArtboard id="calendar" label="F · 日历" width={402} height={874}>
            {frame(<Prototype onlyScreen="calendar"/>, 'calendar')}
          </DCArtboard>
          <DCArtboard id="widgets" label="G · 小组件预览" width={402} height={874}>
            {frame(<Prototype onlyScreen="widgets"/>, 'widgets')}
          </DCArtboard>
          <DCArtboard id="notifications" label="H · 提醒设置" width={402} height={874}>
            {frame(<Prototype onlyScreen="notifications"/>, 'notif')}
          </DCArtboard>
        </DCSection>

        <DCSection id="onboarding" title="首次启动" subtitle="四屏欢迎流程">
          <DCArtboard id="ob1" label="① 欢迎" width={402} height={874}>{frame(<OnboardingPaged page={0}/>, 'ob1')}</DCArtboard>
          <DCArtboard id="ob2" label="② 倒数与纪念" width={402} height={874}>{frame(<OnboardingPaged page={1}/>, 'ob2')}</DCArtboard>
          <DCArtboard id="ob3" label="③ 加照片" width={402} height={874}>{frame(<OnboardingPaged page={2}/>, 'ob3')}</DCArtboard>
          <DCArtboard id="ob4" label="④ 开始" width={402} height={874}>{frame(<OnboardingPaged page={3}/>, 'ob4')}</DCArtboard>
        </DCSection>
      </DesignCanvas>

      {tweaksVisible && (
        <div className="tweaks">
          <h4>Tweaks</h4>
          <div style={{ fontSize: 11, color: '#9AA0A8', lineHeight: 1.5 }}>点击任一屏幕角上的展开按钮进入聚焦模式，方向键可切换屏幕。</div>
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
